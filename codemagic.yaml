# Codemagic CI for this Expo (React Native) app.
# https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# Android: upload the EXISTING Play upload keystore (SHA1
# D4:7A:92:18:B0:7B:53:4A:D9:14:0D:50:9E:DF:46:A5:C6:63:FF:AF) in Team settings
# → Code signing identities, reference name `arena_gym_keystore`.
# Do not generate a new keystore; Play will reject any other signing certificate.
# Optional: add group `google_play` with secret GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
# to auto-increment versionCode from Play and publish to the internal track.
#
# iOS: uses provisioning profile and certificate reference `arenagym`.
# TestFlight upload is omitted until an App Store Connect API key is added
# under Team integrations → Developer Portal.

workflows:
  android-aab:
    name: Android AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      java: 17
      node: 24
      android_signing:
        - arena_gym_keystore
      vars:
        PACKAGE_NAME: com.arenagym.app
        EXPO_PUBLIC_API_URL: https://test-api.arenagym-om.com
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Typecheck and unit tests
        script: |
          npm run check
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --no-install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Configure release signing
        script: |
          node scripts/codemagic-patch-android-gradle.mjs
      - name: Build Android App Bundle
        script: |
          set -euo pipefail
          UPDATED_BUILD_NUMBER="${BUILD_NUMBER}"
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            LATEST_GOOGLE_PLAY_BUILD_NUMBER="$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" || true)"
            if [ -n "${LATEST_GOOGLE_PLAY_BUILD_NUMBER:-}" ]; then
              UPDATED_BUILD_NUMBER="$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))"
            fi
          fi
          echo "Using versionCode ${UPDATED_BUILD_NUMBER}"
          export NODE_ENV=production
          cd android
          ./gradlew :app:bundleRelease --no-daemon --max-workers=2 \
            -PcmVersionCode="$UPDATED_BUILD_NUMBER" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
    artifacts:
      - android/app/build/outputs/**/*.aab
    # Uncomment after adding Codemagic group `google_play` with
    # GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS, and add `groups: [google_play]`
    # under environment.
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  react-native-ios:
    name: React Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 24
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - arenagym
        certificates:
          - arenagym
      vars:
        BUNDLE_ID: com.arenagym.app
        XCODE_WORKSPACE: ArenaGym.xcworkspace
        XCODE_SCHEME: ArenaGym
        EXPO_PUBLIC_API_URL: https://test-api.arenagym-om.com
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up provisioning profiles
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/ArenaGym.xcodeproj"
          echo "Code signing identities:"
          security find-identity -v -p codesigning
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          set -euo pipefail
          xcodebuild -list -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
